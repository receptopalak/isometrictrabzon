name: Deploy Isometric Trabzon to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '21 4 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download real OpenStreetMap and terrain data
        run: |
          python -m pip install -r requirements.txt
          python -m py_compile scripts/fetch_open_data.py scripts/fetch_photos.py
          node --input-type=module --check < src/app.js
          node --input-type=module --check < src/photos.js
          python scripts/fetch_open_data.py
          python scripts/fetch_photos.py
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/trabzon.geojson')
          features = json.loads(path.read_text())['features']
          buildings = [f for f in features if f['properties'].get('building')]
          assert len(buildings) > 0, 'No real buildings; aborting deployment.'
          print('Verified real OSM buildings:', len(buildings))
          PY

      - name: Prepare static site
        run: |
          mkdir -p _site/src _site/data
          cp index.html _site/
          cp src/app.js _site/src/
          cp src/photos.js _site/src/
          cp data/trabzon.geojson _site/data/
          cp data/photos.json _site/data/
          if [ -f data/terrain.json ]; then cp data/terrain.json _site/data/; fi
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
